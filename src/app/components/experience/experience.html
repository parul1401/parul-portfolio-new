<section id="experience" class="section experience">
  <h2>💼 Work Experience</h2>
  <div class="timeline">
    <div class="timeline-item" *ngFor="let exp of experiences">
      <div class="timeline-icon">
        <span>👔</span>
      </div>
      <div class="timeline-content">
        <div class="company-header">
          <h3>{{ exp.role }}</h3>
          <span class="company">{{ exp.company }}</span>
          <span class="date">{{ exp.date }}</span>
          <span class="location">{{ exp.location }}</span>
        </div>
        
        <div class="project" *ngFor="let project of exp.projects">
          <h4>📁 {{ project.name }}</h4>
          <p>{{ project.description }}</p>
          
          <div class="achievements" *ngIf="project.achievements">
            <h5>Key Achievements:</h5>
            <ul>
              <li *ngFor="let achievement of project.achievements">{{ achievement }}</li>
            </ul>
          </div>
          
          <div class="tech-stack">
            <span class="tech-tag" *ngFor="let tech of project.tech">{{ tech }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
