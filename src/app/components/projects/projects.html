<section id="projects" class="section projects">
  <h2 class="section-title">
    <span class="title-icon">🚀</span>
    Featured Projects
    <span class="title-line"></span>
  </h2>
  
  <div class="projects-grid">
    <div class="project-card" *ngFor="let project of projects; let i = index" [style.animation-delay]="i * 0.1 + 's'">
      <div class="card-badge">{{ project.type }}</div>
      
      <div class="card-header">
        <div class="project-icon">{{ getProjectIcon(project.name) }}</div>
        <h3>{{ project.name }}</h3>
      </div>
      
      <p class="project-description">{{ project.description }}</p>
      
      <div class="project-stats" *ngIf="project.highlights">
        <div class="stat-chip" *ngFor="let highlight of project.highlights">
          <span class="stat-check">✓</span>
          {{ highlight }}
        </div>
      </div>
      
      <div class="tech-stack">
        <span class="tech-tag" *ngFor="let tech of project.tech">
          <span class="tech-dot"></span>
          {{ tech }}
        </span>
      </div>
      
      <div class="card-overlay">
        <button class="view-btn">View Project →</button>
      </div>
    </div>
  </div>
</section>
